app = 'trackdown-pvss-clone'
primary_region = 'ams'

[build]
[http_service]
  auto_start_machines = true
  auto_stop_machines = false
  force_https = true
  internal_port = 8080
  min_machines_running = 1
  processes = [ "app" ]

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
