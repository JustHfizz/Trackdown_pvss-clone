# fly.toml app configuration file generated for trackdown-pvss-clone on 2026-11-24T22:23:58Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = "trackdown-pvss-clone"
primary_region = 'ams'
kill_timeout = '4s'

[env]
  PORT = "8080"

[http_service]
  auto_start_machines = false
  auto_stop_machines = 'off'
  force_https = false
  internal_port = 8080
  min_machines_running = 1
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '256mb'
